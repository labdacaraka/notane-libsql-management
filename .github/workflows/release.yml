name: Release & Multi-Platform Bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft release'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Desktop Apps: macOS (Silicon & Intel), Windows, Linux Desktop
  # --------------------------------------------------------------------------
  build-desktop:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS-AppleSilicon
            os: macos-latest
            target: aarch64-apple-darwin
            sqld_target: aarch64-apple-darwin
          - name: macOS-Intel
            os: macos-latest
            target: x86_64-apple-darwin
            sqld_target: x86_64-apple-darwin
          - name: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            sqld_target: none
          - name: Linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            sqld_target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Download bundled sqld engine binary
        if: matrix.platform.sqld_target != 'none'
        shell: bash
        run: |
          ./scripts/download-sqld.sh ${{ matrix.platform.sqld_target }}

      - name: Configure macOS code signing
        if: matrix.platform.os == 'macos-latest'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_VAL: ${{ secrets.APPLE_ID }}
          APPLE_PASS: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ]; then
            echo "APPLE_CERTIFICATE=$CERT" >> $GITHUB_ENV
            echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASS" >> $GITHUB_ENV
            echo "APPLE_SIGNING_IDENTITY=$SIGN_ID" >> $GITHUB_ENV
            echo "APPLE_ID=$APPLE_ID_VAL" >> $GITHUB_ENV
            echo "APPLE_PASSWORD=$APPLE_PASS" >> $GITHUB_ENV
            echo "APPLE_TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          fi

      - name: Configure Windows code signing
        if: matrix.platform.os == 'windows-latest'
        shell: bash
        env:
          CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$CERT" ]; then
            echo "WINDOWS_CERTIFICATE=$CERT" >> $GITHUB_ENV
            echo "WINDOWS_CERTIFICATE_PASSWORD=$CERT_PASS" >> $GITHUB_ENV
          fi

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Notane LibSQL Management ${{ github.ref_name }}'
          releaseBody: |
            ## Release ${{ github.ref_name }}
            
            Self-hosted libSQL (sqld) database manager and server engine.
            
            ### Included Packages:
            - **macOS (Apple Silicon M1/M2/M3/M4)**: `.dmg` / `.app`
            - **macOS (Intel Core x86_64)**: `.dmg` / `.app`
            - **Windows (x64)**: `.exe` (NSIS Installer) / `.msi`
            - **Linux Desktop**: `.deb` / `.AppImage`
            - **VPS Server (Docker)**: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            - **VPS Server (Non-Docker)**: Run `curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-vps.sh | sudo bash`
          releaseDraft: ${{ github.event.inputs.draft == 'true' || false }}
          prerelease: false
          args: --target ${{ matrix.platform.target }}

  # --------------------------------------------------------------------------
  # 2. VPS Server Docker Image (Multi-Arch: linux/amd64 + linux/arm64)
  # --------------------------------------------------------------------------
  build-docker:
    name: Build & Push Docker Image for VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Multi-Arch Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
